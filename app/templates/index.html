<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Support</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >
</head>

<body>

    <main class="container py-5">

        <div class="text-center mb-5">
            <h1>Customer Support</h1>
            <p class="text-muted">
                Customer information management
            </p>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">

                <h2 class="h4 mb-4">Search customer</h2>

                <form id="customer-search-form">

                    <div class="row g-3">

                        <div class="col-md-4">
                            <label for="document-type" class="form-label">
                                Document type
                            </label>

                            <select
                                id="document-type"
                                class="form-select"
                                required
                            >
                                <option value="">Select a type</option>
                            </select>
                        </div>

                        <div class="col-md-5">
                            <label for="document-number" class="form-label">
                                Document number
                            </label>

                            <input
                                type="text"
                                id="document-number"
                                class="form-control"
                                placeholder="Enter document number"
                                required
                            >
                        </div>

                        <div class="col-md-3 d-flex align-items-end">
                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Search
                            </button>
                        </div>

                    </div>

                </form>

                <div
                    id="error-message"
                    class="alert alert-danger mt-4 d-none"
                    role="alert"
                ></div>

            </div>
        </div>


        <section id="customer-result" class="d-none">

            <div class="card shadow-sm mb-4">
                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="h4 mb-0">Customer information</h2>

                        <a
                            id="export-customer"
                            href="#"
                            class="btn btn-primary"
                        >
                            Export
                        </a>
                    </div>

                    <div class="row">

                        <div class="col-md-6">
                            <p>
                                <strong>Document:</strong>
                                <span id="customer-document"></span>
                            </p>

                            <p>
                                <strong>Name:</strong>
                                <span id="customer-name"></span>
                            </p>
                        </div>

                        <div class="col-md-6">
                            <p>
                                <strong>Email:</strong>
                                <span id="customer-email"></span>
                            </p>

                            <p>
                                <strong>Phone:</strong>
                                <span id="customer-phone"></span>
                            </p>
                        </div>

                    </div>

                </div>
            </div>


            <div class="card shadow-sm">
                <div class="card-body">

                    <h2 class="h4 mb-4">Purchases</h2>

                    <div class="table-responsive">

                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Amount</th>
                                    <th>Description</th>
                                </tr>
                            </thead>

                            <tbody id="purchases-table-body">
                            </tbody>
                        </table>

                    </div>

                </div>
            </div>

        </section>


        <section id="loyal-customers-section" class="mt-5">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h2>Loyal Customer(s)</h2>

                <div class="d-flex gap-2">

                    <button
                        id="load-loyal-customers"
                        class="btn btn-primary"
                        type="button"
                    >
                        Check Report
                    </button>

                    <a
                        href="/reports/loyal-customers/export"
                        class="btn btn-primary"
                    >
                        Export Report
                    </a>

                </div>

            </div>

            <div
                id="loyal-customers-error"
                class="alert alert-danger d-none"
                role="alert"
            ></div>

            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Document</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Total</th>
                        </tr>
                    </thead>

                    <tbody id="loyal-customers-table-body">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>

</body>
</html>
